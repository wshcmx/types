name: Publishing NuGet package

on:
  workflow_dispatch:
    inputs:
      version:
        required: false
        type: string
  release:
    types: [created]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    env:
      PROJECT: dotnet/Wshcmx.Types/Wshcmx.Types.csproj
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 25

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - run: npm ci
      - run: npm run generate:dotnet

      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ inputs.version }}" ]; then
            echo "value=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=" >> "$GITHUB_OUTPUT"
          fi

      - name: Pack
        run: |
          VERSION_ARG=""
          if [ -n "${{ steps.version.outputs.value }}" ]; then
            VERSION_ARG="-p:Version=${{ steps.version.outputs.value }}"
          fi
          dotnet pack "$PROJECT" -c Release -o ./nupkg $VERSION_ARG

      - name: NuGet login
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to NuGet.org
        run: |
          dotnet nuget push "./nupkg/*.nupkg" \
            --source "https://api.nuget.org/v3/index.json" \
            --api-key ${{steps.login.outputs.NUGET_API_KEY}} \
            --skip-duplicate
